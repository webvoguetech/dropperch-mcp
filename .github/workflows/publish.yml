name: Publish

# Runs on a version tag (v1.0.0). Publishes the package to npm, then lists it
# in the official MCP Registry. The registry checks that the npm package
# exists and carries the same mcpName, so the order matters.
#
# Needs one repository secret, NPM_TOKEN: an npm granular access token with
# read and write on dropperch-mcp (or "all packages" for the first publish).
# The MCP Registry step needs no secret: it signs in with GitHub OIDC, which
# proves this repository is io.github.webvoguetech/*.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm test

      - name: Publish to npm (skipped if this version is already there)
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "dropperch-mcp@$version" version >/dev/null 2>&1; then
            echo "dropperch-mcp@$version is already on npm"
            echo "on_npm=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            # The registry refuses a server whose npm package does not exist,
            # so without a token there is nothing more to do this run.
            echo "::warning::No NPM_TOKEN secret yet. Add one, then re-run this workflow to publish to npm and the MCP Registry."
            echo "on_npm=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --access public --provenance
            echo "on_npm=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.npm.outputs.on_npm == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.npm.outputs.on_npm == 'true'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Sign in to the MCP Registry
        if: steps.npm.outputs.on_npm == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        if: steps.npm.outputs.on_npm == 'true'
        run: ./mcp-publisher publish
