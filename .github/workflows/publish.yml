name: Publish

# Runs on a version tag (v1.0.0). Publishes the package to npm, then lists it
# in the official MCP Registry. The registry checks that the npm package
# exists and carries the same mcpName, so the order matters.
#
# No secrets. npm publishes through Trusted Publishing: npmjs.com trusts this
# repository's publish.yml, and the job proves who it is with a GitHub OIDC
# token (npm CLI 11.5.1 or later; provenance is attached automatically). The
# MCP Registry step signs in the same way, which proves this repository is
# io.github.webvoguetech/*.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test

      - name: Publish to npm (skipped if this version is already there)
        id: npm
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "dropperch-mcp@$version" version >/dev/null 2>&1; then
            echo "dropperch-mcp@$version is already on npm"
          else
            npm publish --access public
          fi
          echo "on_npm=true" >> "$GITHUB_OUTPUT"

      # npm can take several minutes to serve a new version, and the registry
      # refuses one it cannot see yet (seen on 1.0.0 and 1.0.1).
      - name: Wait until npm serves this version
        if: steps.npm.outputs.on_npm == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 40); do
            npm view "dropperch-mcp@$version" version >/dev/null 2>&1 && exit 0
            echo "waiting for dropperch-mcp@$version on npm ($i/40)"
            sleep 30
          done
          echo "::error::dropperch-mcp@$version did not appear on npm within 20 minutes"
          exit 1

      - name: Install cosign
        if: steps.npm.outputs.on_npm == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.npm.outputs.on_npm == 'true'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Sign in to the MCP Registry
        if: steps.npm.outputs.on_npm == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        if: steps.npm.outputs.on_npm == 'true'
        run: ./mcp-publisher publish
